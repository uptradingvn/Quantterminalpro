<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 380" width="340" height="380" fill="none">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="aiHalo" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.14"/>
      <stop offset="80%" stop-color="#0369a1" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#06192f" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Titanium Gradient -->
    <linearGradient id="titaniumGrad" x1="80" y1="60" x2="260" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="25%" stop-color="#94a3b8"/>
      <stop offset="55%" stop-color="#334155"/>
      <stop offset="85%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Deep Obsidian Armor -->
    <linearGradient id="obsidianArmor" x1="100" y1="180" x2="240" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="35%" stop-color="#0f172a"/>
      <stop offset="75%" stop-color="#09121f"/>
      <stop offset="100%" stop-color="#040912"/>
    </linearGradient>

    <!-- Chrome Edge Highlight -->
    <linearGradient id="chromeEdge" x1="120" y1="40" x2="220" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#93c5fd" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Premium Holographic Visor -->
    <linearGradient id="visorLuxury" x1="110" y1="120" x2="230" y2="165" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="25%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="75%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Card Shadow -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Ambient Light Sphere -->
  <circle cx="170" cy="180" r="140" fill="url(#aiHalo)"/>

  <!-- Orbital Data Ring (Futuristic Gyroscope Ring) -->
  <ellipse cx="170" cy="190" rx="148" ry="58" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="8 6 2 6" opacity="0.4" transform="rotate(-15 170 190)"/>
  <ellipse cx="170" cy="190" rx="156" ry="62" stroke="#00e5ff" stroke-width="0.8" stroke-dasharray="16 8 4 6" opacity="0.3" transform="rotate(20 170 190)"/>

  <!-- ==================== CHARACTER BODY (BALANCED & PROFESSIONAL) ==================== -->
  
  <!-- Outer Trapezius & Shoulders -->
  <path d="M65 380 C68 310, 102 265, 138 245 L170 258 L202 245 C238 265, 272 310, 275 380 Z" fill="url(#obsidianArmor)"/>
  
  <!-- Shoulder Precision Armor Plates -->
  <path d="M72 380 C74 320, 104 278, 134 256 L142 272 C116 292, 94 330, 92 380 Z" fill="url(#titaniumGrad)"/>
  <path d="M268 380 C266 320, 236 278, 206 256 L198 272 C224 292, 246 330, 248 380 Z" fill="url(#titaniumGrad)"/>
  
  <!-- Shoulder Highlights -->
  <path d="M76 380 C78 325, 106 284, 134 260" stroke="url(#chromeEdge)" stroke-width="2" stroke-linecap="round"/>
  <path d="M264 380 C262 325, 234 284, 206 260" stroke="url(#chromeEdge)" stroke-width="2" stroke-linecap="round"/>

  <!-- Ergonomic Neck & Collar Support -->
  <path d="M148 248 L148 206 L192 206 L192 248 Z" fill="#0b1320" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="152" y1="214" x2="188" y2="214" stroke="#1e3a5f" stroke-width="2"/>
  <line x1="152" y1="222" x2="188" y2="222" stroke="#1e3a5f" stroke-width="2"/>
  <line x1="152" y1="230" x2="188" y2="230" stroke="#1e3a5f" stroke-width="2"/>

  <!-- Neck Lateral Cyber Tendons -->
  <path d="M140 248 L148 208 M200 248 L192 208" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>

  <!-- Chest Reactor Core (Symmetrical High-Tech Medallion) -->
  <path d="M135 275 L170 292 L205 275 L196 345 L170 360 L144 345 Z" fill="#07111e" stroke="#1e3a5f" stroke-width="1.8"/>
  <polygon points="170,298 190,310 190,332 170,344 150,332 150,310" fill="#0b1e36" stroke="#00e5ff" stroke-width="1.5"/>
  
  <!-- Glowing Reactor Crystal -->
  <circle cx="170" cy="321" r="10" fill="#00e5ff" opacity="0.9" filter="url(#neonFilter)"/>
  <circle cx="170" cy="321" r="5" fill="#ffffff"/>

  <!-- Central Code Brackets Symbol in Reactor Core -->
  <path d="M164 316 L160 321 L164 326" stroke="#06192f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M176 316 L180 321 L176 326" stroke="#06192f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="168" y1="326" x2="172" y2="316" stroke="#06192f" stroke-width="1.6" stroke-linecap="round"/>

  <!-- ==================== HEAD / CYBERNETIC ANDROID FACE ==================== -->
  
  <!-- Cranium Silhouette (Refined & Elegant Proportions) -->
  <path d="M118 135 C118 75, 140 45, 170 45 C200 45, 222 75, 222 135 C222 178, 208 214, 170 216 C132 214, 118 178, 118 135 Z" fill="url(#obsidianArmor)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Polished Titanium Helmet Plates -->
  <path d="M120 120 C120 70, 140 50, 170 50 C200 50, 220 70, 220 120 C214 96, 196 68, 170 68 C144 68, 126 96, 120 120 Z" fill="url(#titaniumGrad)"/>
  
  <!-- Crown Apex Highlight -->
  <path d="M136 78 C148 64, 160 58, 170 58 C180 58, 192 64, 204 78" stroke="url(#chromeEdge)" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Cybernetic Audio / Neural Comm Modules (Left & Right) -->
  <g id="commLeft">
    <rect x="106" y="122" width="14" height="46" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="113" cy="132" r="3" fill="#00e5ff"/>
    <line x1="110" y1="144" x2="116" y2="144" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="110" y1="152" x2="116" y2="152" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="110" y1="160" x2="116" y2="160" stroke="#00e5ff" stroke-width="1.5"/>
  </g>

  <g id="commRight">
    <rect x="220" y="122" width="14" height="46" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="227" cy="132" r="3" fill="#00e5ff"/>
    <line x1="224" y1="144" x2="230" y2="144" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="224" y1="152" x2="230" y2="152" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="224" y1="160" x2="230" y2="160" stroke="#00e5ff" stroke-width="1.5"/>
  </g>

  <!-- Lower Face / Jaw Guard (Sleek Angular Geometry) -->
  <path d="M132 140 C132 172, 144 204, 170 206 C196 204, 208 172, 208 140 Z" fill="#070e17" stroke="#1e3a5f" stroke-width="1.5"/>
  
  <!-- Chin Accent Plate -->
  <polygon points="156,192 170,204 184,192 178,182 162,182" fill="#1e293b" stroke="#00e5ff" stroke-width="1.2"/>

  <!-- ==================== HOLOGRAPHIC QUANT VISOR ==================== -->
  <!-- Wide-angle Cyber Visor -->
  <path d="M125 124 C132 114, 150 108, 170 108 C190 108, 208 114, 215 124 L212 156 C202 166, 186 172, 170 172 C154 172, 138 166, 128 156 Z" fill="url(#visorLuxury)" stroke="#00f0ff" stroke-width="2" filter="url(#neonFilter)"/>

  <!-- Top Glass Glare -->
  <path d="M132 126 C142 118, 155 114, 170 114 C185 114, 198 118, 208 126 L205 133 C196 127, 184 123, 170 123 C156 123, 144 127, 135 133 Z" fill="#ffffff" opacity="0.6"/>

  <!-- Futuristic Heads-Up-Display (HUD) Waveform inside Visor -->
  <g opacity="0.95">
    <!-- Center Audio/Quant wave -->
    <path d="M140 144 L146 144 L150 136 L154 150 L158 138 L162 146 L166 141 L170 147 L174 139 L178 148 L182 140 L186 144 L200 144" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Binary Matrix Dots -->
    <circle cx="150" cy="156" r="1.5" fill="#38bdf8"/>
    <circle cx="158" cy="156" r="1.5" fill="#38bdf8"/>
    <circle cx="166" cy="156" r="1.5" fill="#ffffff"/>
    <circle cx="174" cy="156" r="1.5" fill="#38bdf8"/>
    <circle cx="182" cy="156" r="1.5" fill="#38bdf8"/>
    <circle cx="190" cy="156" r="1.5" fill="#00e5ff"/>
  </g>

  <!-- Crown Signal Emitter / Quantum Node -->
  <line x1="170" y1="45" x2="170" y2="20" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="170" cy="16" r="5" fill="#00f0ff" filter="url(#neonFilter)"/>
  <circle cx="170" cy="16" r="2.5" fill="#ffffff"/>
  
  <!-- Subtle Radio Pulse Waves -->
  <path d="M158 12 C164 6, 176 6, 182 12" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M150 6 C160 -2, 180 -2, 190 6" stroke="#00e5ff" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- ==================== 4 PROFESSIONAL QUANT BADGES (PINE, AFL, MQL4, MQL5) ==================== -->
  <!-- HIGH CONTRAST, BOLD, INSTANTLY LEGIBLE -->

  <!-- 1. PINE (Top Left Badge) -->
  <g id="badgePine" transform="translate(14, 88)" filter="url(#badgeShadow)">
    <rect x="0" y="0" width="76" height="30" rx="8" fill="#06192f" stroke="#10b981" stroke-width="2"/>
    <circle cx="14" cy="15" r="4.5" fill="#10b981"/>
    <circle cx="14" cy="15" r="2" fill="#ffffff"/>
    <text x="26" y="20" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="0.6">PINE</text>
  </g>
  <!-- Connector Line from Pine badge to assistant -->
  <path d="M90 103 L118 120" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- 2. AFL (Top Right Badge) -->
  <g id="badgeAfl" transform="translate(250, 88)" filter="url(#badgeShadow)">
    <rect x="0" y="0" width="76" height="30" rx="8" fill="#06192f" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="14" cy="15" r="4.5" fill="#f59e0b"/>
    <circle cx="14" cy="15" r="2" fill="#ffffff"/>
    <text x="26" y="20" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="0.6">AFL</text>
  </g>
  <!-- Connector Line from AFL badge to assistant -->
  <path d="M250 103 L222 120" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- 3. MQL4 (Bottom Left Badge - Replaced PY_QUANT as requested!) -->
  <g id="badgeMql4" transform="translate(10, 248)" filter="url(#badgeShadow)">
    <rect x="0" y="0" width="86" height="30" rx="8" fill="#06192f" stroke="#00e5ff" stroke-width="2"/>
    <circle cx="14" cy="15" r="4.5" fill="#00e5ff"/>
    <circle cx="14" cy="15" r="2" fill="#ffffff"/>
    <text x="25" y="20" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="0.6">MQL4</text>
  </g>
  <!-- Connector Line from MQL4 badge to torso -->
  <path d="M96 263 L126 276" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- 4. MQL5 (Bottom Right Badge) -->
  <g id="badgeMql5" transform="translate(244, 248)" filter="url(#badgeShadow)">
    <rect x="0" y="0" width="86" height="30" rx="8" fill="#06192f" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="14" cy="15" r="4.5" fill="#3b82f6"/>
    <circle cx="14" cy="15" r="2" fill="#ffffff"/>
    <text x="25" y="20" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="0.6">MQL5</text>
  </g>
  <!-- Connector Line from MQL5 badge to torso -->
  <path d="M244 263 L214 276" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>

</svg>
